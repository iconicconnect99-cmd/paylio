{% extends 'partials/base.html' %}
{% load static %}
{% block content %}
<section class="login-reg">
    <div class="overlay pt-120">
        <div class="container">
            <div class="row align-items-center justify-content-center">
                <div class="col-xl-5">
                    <div class="section-text text-center">
                        <h5 class="sub-title">Paylio Administration</h5>
                        <h2 class="title">Admin Sign In</h2>
                        <p class="dont-acc">
                            Need an approved admin account?
                            <a href="{% url 'userauths:admin-sign-up' %}">Admin Sign Up</a>
                        </p>
                    </div>

                    {% if messages %}
                        {% for message in messages %}
                            <p class="alert-danger alert">{{ message }}</p>
                        {% endfor %}
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{{ next }}">
                        <div class="row">
                            <div class="col-12">
                                <div class="single-input">
                                    <input type="email" required name="email" placeholder="Admin Email">
                                </div>
                                <div class="single-input">
                                    <input type="password" required name="password" placeholder="Password">
                                </div>
                                <button class="cmn-btn w-100" type="submit">Sign In to Admin</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock content %}
